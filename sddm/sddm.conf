# Copied to /etc/sddm.conf.d/10-theme.conf — see MANUAL-INSTALL.md.
#
# The theme itself lives in sddm/themes/apollo and has to be copied into
# /usr/share/sddm/themes: the greeter runs as the unprivileged `sddm` user and
# cannot follow a symlink into your home directory, which is how every other
# config in this repo is deployed.
[Theme]
Current=apollo
