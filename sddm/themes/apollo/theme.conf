# Apollo's login screen.
#
# Every value here is rewritten by `apollo-sddm-sync`, which copies the palette
# apollo-settings generated from your wallpaper and the wallpaper itself into
# the installed copy of this theme. What is committed is the starting point —
# Catppuccin Mocha, and no background, which draws the plain `base` colour.
#
# Editing this file in the repo does nothing on its own: the greeter reads
# /usr/share/sddm/themes/apollo/theme.conf, and it cannot follow a symlink into
# your home directory, because it runs as the unprivileged `sddm` user.
[General]
background=
base=#1e1e2e
mantle=#181825
crust=#11111b
surface0=#313244
surface1=#45475a
overlay1=#7f849c
subtext0=#a6adc8
text=#cdd6f4
