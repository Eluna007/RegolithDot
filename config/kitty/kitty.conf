background_opacity 0.42

# macOS-like clipboard in terminal
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# ctrl+shift combos forwarded to terminal apps
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


font_family JetBrainsMono Nerd Font Mono
font_size 11

# ─── Palette ───
# Generated from the Apollo palette (flavor + accent, and a wallust palette
# when one is active) by apollo-settings. `include` is resolved against this
# file's directory. apollo-colors.conf is gitignored — apollo-doctor seeds it
# from the committed apollo-colors.default.conf, so run the doctor once after
# cloning.
#
# kitty re-reads this on ctrl+shift+f5, or in any window opened afterwards.
include apollo-colors.conf
