general {
    # Luna's hyprlock.conf pulls its colours from hyprlock-colors.conf, which
    # generate-hyprlock-colors.sh writes from the current wallpaper. So just
    # call hyprlock directly — Moonlit's lock.sh symlinked awww's wallpaper
    # cache into /tmp first, and that cache isn't in use here.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock just before suspending
    after_sleep_cmd = hyprctl dispatch dpms on  # turn the display back on after wake
}

# Suspend after 15 minutes of no activity.
# (Caffeine in Quick Settings inhibits idle and pauses this.)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
