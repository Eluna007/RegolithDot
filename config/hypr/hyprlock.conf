# ╭──────────────────────────────────────────────────────────────────────╮
# │  Apollo lock screen                                                  │
# │                                                                      │
# │  Layouts vendored from github.com/mahaveergurjar/Hyprlock-Dots,      │
# │  rewired so their colours come from matugen instead of being         │
# │  hardcoded. Upstream ships no LICENSE; kept with attribution.        │
# ╰──────────────────────────────────────────────────────────────────────╯
#
# TO SWITCH LAYOUTS: change the one uncommented `source` line at the bottom.
# No rebuild, no reload - hyprlock reads this fresh every time it starts.

$hyprlockDir = $HOME/.config/hyprlock

# ── Generated, in dependency order ──────────────────────────────────────
# colors.conf    matugen            17 colour variables, rewritten on every
#                                   wallpaper change
# wallpaper.conf hyprlock-wallpaper.sh  $wall, the current wallpaper's path
# assets.conf    you                $avatar, $cover - tracked in git
#
# The first two are gitignored machine state. If either is missing, hyprlock
# renders the layout with unset variables, which reads as black on black - run
# `wallpaper-switch.sh <some wallpaper>` to regenerate both.
source = $hyprlockDir/colors.conf
source = $hyprlockDir/wallpaper.conf
source = $hyprlockDir/assets.conf

# ── Scripts the layouts call ────────────────────────────────────────────
# All of these need `playerctl`; layout18's visualiser also needs `cava`, and
# layout15's weather needs `curl`. apollo-doctor checks for them.
$music    = $hyprlockDir/scripts/playerctlock.sh
$album    = $hyprlockDir/scripts/hlock_mpris.sh
$battery  = $hyprlockDir/scripts/battery.sh
$location = $hyprlockDir/scripts/location.sh
$weather  = $hyprlockDir/scripts/weather.sh

# ── Pick one ────────────────────────────────────────────────────────────
# 12  minimal, left-aligned: welcome, clock, username + password pills
# 15  centred clock; right column of music, weather, battery, avatar
# 18  music-first: album art, transport, progress, cava visualiser
# 20  widget dashboard: login card, clock + uptime, music, wifi/bt, battery
source = $hyprlockDir/layouts/layout12.conf
# source = $hyprlockDir/layouts/layout15.conf
# source = $hyprlockDir/layouts/layout18.conf
# source = $hyprlockDir/layouts/layout20.conf
