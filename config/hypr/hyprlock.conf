# $accent is written by ~/.local/bin/generate-hyprlock-colors.sh, which pulls
# matugen's current "primary" colour out of ~/.config/quickshell/colors.json.
# That file is regenerated on every wallpaper change, so the lock screen
# follows the wallpaper. It is gitignored — it's machine state, not config.
source = ~/.config/hypr/hyprlock-colors.conf

$photo = ~/Pictures/gifs/FrierenxGengar.png
$font = JetBrainsMono Nerd Font Mono

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

# Profile photo
image {
    monitor =
    path = $photo
    border_size = 3
    border_color = $accent
    size = 150
    rounding = -1
    position = 0, 190
    halign = center
    valign = center
}

# Username, small label above the input field
label {
    monitor =
    text = $USER
    color = rgba(230, 230, 240, 0.75)
    font_size = 15
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# Colored accent block behind the input field
shape {
    monitor =
    size = 264, 59
    color = $accent
    rounding = 16
    border_size = 0
    rotate = 0
    xray = false
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 55
    outline_thickness = 0
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(20, 20, 28, 0.9)
    font_color = rgb(230, 230, 240)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##e6e6f099">Password</span></i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}
