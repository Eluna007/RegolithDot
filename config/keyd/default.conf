# keyd: a meta layer for the copy/paste shortcuts, and nothing else.
#
# ── Why the exclusions matter ────────────────────────────────────────────
#
# keyd captures a device with EVIOCGRAB and re-emits its events through a
# virtual one. That is what lets it remap keys — and it is why it must never
# be pointed at a pointing device it has no business rewriting.
#
# A bare `*` does exactly that. From keyd's own source:
#
#   device.c:192      a device is managed if it has *any* capability, so mice
#                     and touchpads are enumerated alongside keyboards
#   config.c:1071     config_check_match() falls through to
#                     `return config->wildcard ? 1 : 0` — the wildcard does no
#                     capability filtering whatsoever
#
# So `*` alone hands keyd this laptop's touchpad, and every touch then travels
# through a grab-and-re-emit path that has no reason to exist. An intermittently
# dead touchpad is what that looks like from the outside.
#
# `k:*` is NOT the fix, though it reads like it. The `k:` branch (config.c:864)
# stores what follows as a literal id, and matching is a prefix compare against
# real ids like "04f3:0007" — so `k:*` matches nothing, never sets the wildcard,
# and keyd silently captures no devices at all. The meta layer below would stop
# working with no error anywhere.
#
# Exclusions are the mechanism keyd actually provides. Find yours with
# `sudo keyd monitor`, which prints the id of every device as you use it.
[ids]
*
-04f3:0007      # Elan Touchpad
-04f3:2a8a      # ELAN901C touchscreen

[global]
disable_modifier_guard = 1

[main]
meta = layer(meta)

[meta]
c = C-c
v = C-v
x = C-x
z = C-z
