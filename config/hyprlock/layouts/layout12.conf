# Vendored from github.com/mahaveergurjar/Hyprlock-Dots (layout12).
# Upstream ships no LICENSE; kept here with attribution.
#
# Changes from upstream:
#   - colours are $variables from colors.conf, generated by matugen, so the
#     lock screen recolours with the wallpaper like the rest of Apollo
#   - $wall and $avatar come from colors.conf too; upstream hardcoded a
#     checked-in image (two of them under the upstream author's home dir)

# BACKGROUND
background {
    monitor =
    path = $wall
    #blur_passes = 0
    #contrast = 0.8916
    #brightness = 0.8172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

# GREETINGS
label {
    monitor =
    text =Welcome!
    color = $fg
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = -630, 320
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $fg
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = -630, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    # Upstream hardcoded "Sunday, September 29" here, so it showed that date
    # forever. 60s refresh, not 1s: the date changes once a day.
    text = cmd[update:60000] echo -e "$(date +"%A, %B %d")"
    color = $fg_a75
    font_size = 20
    text_align = left
    font_family = JetBrainsMono Nerd Font
    position = 180, 175
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = $avatar
    border_size = 1
    border_color = $accent_a75
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = -630, 25
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = $surface_a40
    rounding = -1
    border_size = 0
    border_color = $fg
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -630, -140
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = $fg_dim
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position =-630, -140
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $transparent
    inner_color = $surface_a40
    font_color = $fg
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>🔒 Enter Pass</i>
    hide_input = false
    position = -630, -220
    halign = center
    valign = center
}

# Dragons be here - music widget

# Music blur div
shape {
    monitor =
    size = 350, 110
    color = $surface_a40
    rounding = 20
    rotate = 0
    position = -630, -350
    halign = center
    valign = center
    zindex = 1
}

# Music Album Art
image {
    monitor =
    path = $cover
    size = 86
	border_size = 3
	border_color = $fg_a80
    rounding = 5
    rotate = 0
    reload_time = 2
    reload_cmd = $album
    position = 167, -350
    halign = left
    valign = center
    zindex = 5
}


# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = $fg_dim
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 270, -375
    halign = left
    valign = center
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = $fg
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 270, -350
    halign = left
    valign = center
    zindex = 5
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --source)" &
    color = $fg_dimmer
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono
    position = 270, -320
    halign = left
    valign = center
    zindex = 5
}
