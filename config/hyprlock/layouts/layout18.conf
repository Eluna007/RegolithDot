# Vendored from github.com/mahaveergurjar/Hyprlock-Dots (layout18).
# Upstream ships no LICENSE; kept here with attribution.
#
# Changes from upstream:
#   - colours are $variables from colors.conf, generated by matugen, so the
#     lock screen recolours with the wallpaper like the rest of Apollo
#   - $wall and $avatar come from colors.conf too; upstream hardcoded a
#     checked-in image (two of them under the upstream author's home dir)

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}


# BACKGROUND
background {
    path = $wall
    # color = rgba(255, 0, 0, 0)
    blur_passes = 0

}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color =$accent
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = -60, 400
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = $fg_dim
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $fg_dimmer
    font_size = 19
    font_family = TeachingPrintDotted-OVKlp
    position = 0, 340
    halign = center
    valign = center
}



# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $transparent
    inner_color = $accent_2
    font_color = $on_accent_2
    fade_on_empty = true
    placeholder_text = <i><span foreground="$on_accent_2_hex">   Enter passwd</span></i>
    hide_input = false
    position = 0, -460
    halign = center
    valign = center
    rounding = 15
}

# USER-BOX
shape {
    monitor =
    size = 200, 50
    color = $accent_2
    rounding = 15
    border_size = 0
    border_color = $fg
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -460
    halign = center
    valign = center
}

# USER
label {
    monitor =
    # text = <i> Hi! $USER ;) </i>
    text = cmd[update:60000] echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" 
    color = $on_accent_2
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 11
    position = 0, -460
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = $avatar
    border_size = 2
    border_color = $accent_3 
    size = 220
    rounding = 35
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
}

# MAIN-BOX
shape {
    monitor =
    size = 500, 500
    color = $accent_2
    rounding = 25
    border_size = 0
    border_color = $fg
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
}


# Music album art
image {
    monitor =
    path = $cover
    size = 220
    rounding = 35
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = $on_accent_2
    font_size = 15
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -50
    halign = center
    valign = center
    zindex = 5
}

# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = $on_accent_2
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mon440, 110o ExtraBold
    position = 0, -90
    halign = center
    valign = center
    zindex = 5
}

# heart icon
label {
    monitor =
    text = 
    onclick = playerctl -p spotify previous
    color = $on_accent_2
    font_size = 25
    position = -110, -150
    halign = center
    valign = center
    zindex = 5
}

# Step Backward
label {
    monitor =
    text = 
    onclick = playerctl -p spotify previous
    color = $on_accent_2
    font_size = 25
    position = -60, -150
    halign = center
    valign = center
    zindex = 5
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)"
    onclick = playerctl -p spotify play-pause
    color = $on_accent_2
    font_size = 21
    position = 0, -150
    halign = center
    valign = center
    zindex = 5
}

# Step Forward
label {
    monitor =
    text = 
    onclick = playerctl -p spotify next
    color = $on_accent_2
    font_size = 25
    position = 60, -150
    halign = center
    valign = center
    zindex = 5
}
# Plus icon
label {
    monitor =
    text = 󰐙
    onclick = playerctl -p spotify next
    color = $on_accent_2
    font_size = 25
    position = 110, -150
    halign = center
    valign = center
    zindex = 5
}

# MUSIC PROGRESS
label {
    monitor =
    text = cmd[update:1000]  $HOME/.config/hyprlock/scripts/music-progress.sh
    font_size = 16
    color = $on_accent_2
    position = 0, -200
    halign = center
    valign = center
    zindex = 5
}


# Music Visualizer Label
label {
    # 50ms update rate (cmd[update:50]) for fluid animation
    text = cmd[update:50] ~/.config/hyprlock/scripts/cava.sh
    font_family = JetBrains Mono Nerd Font Mono
    font_size = 7
    halign = center
    valign = center
    position = 0, -294
    markup = true
    zindex = 5
}