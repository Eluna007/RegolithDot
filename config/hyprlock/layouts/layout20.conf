# Vendored from github.com/mahaveergurjar/Hyprlock-Dots (layout20).
# Upstream ships no LICENSE; kept here with attribution.
#
# Changes from upstream:
#   - colours are $variables from colors.conf, generated by matugen, so the
#     lock screen recolours with the wallpaper like the rest of Apollo
#   - $wall and $avatar come from colors.conf too; upstream hardcoded a
#     checked-in image (two of them under the upstream author's home dir)

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = $surface_a30
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] uname -n
    color = $fg_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Log in
    color = $fg
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

# Username Display 
shape {
    monitor =
    size = 320, 70
    color = $accent
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = username
    color = $on_accent
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$USER</b>"
    color = $on_accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -290, 115
    halign = center
    valign = center
    zindex = 3
}

# Password Input
label {
    monitor =
    text = password
    color = $on_accent
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = $transparent
    inner_color = $accent
    font_color = $on_accent
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    rounding = 20
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = $surface_a30
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = $fg
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = $fg_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}


# --- RIGHT COLUMN ---

# PROFILE CARD (Blurred)
shape {
    monitor =
    size = 360, 380
    color = $surface_a30
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $avatar
    size = 120
    rounding = 20
    border_size = 4
    border_color = $accent
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = $fg
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = $fg_dim
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 320
    color = $surface_a80
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $shadow
    zindex = 10
}

# Media Info
label {
    monitor =
    text = cmd[update:1000] echo " <b>$($music --icon)</b> "
    color = $fg
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 200, -10
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] t=$($music --title 24); echo "${t:-No Music Playing}"
    color = $fg
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, -40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] $music --artist 30
    color = $fg_dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -60
    halign = center
    valign = center
    zindex = 11
}

# Connectivity Buttons
shape {
    monitor =
    size = 150, 75
    color = $accent_2
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b> 
    color = $on_accent_2
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] $network --wifi 14
    color = $on_accent_2
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = $accent_2
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b> 
    color = $on_accent_2
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] $network --bluetooth 14
    color = $on_accent_2
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = $accent
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

# Battery Inner icon block
shape {
    monitor =
    size = 100, 20
    color = $on_accent
    rounding = 5
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] if [ "$($battery --charging)" = no ]; then echo " <b>!</b> "; else echo " <b>󰚥</b> "; fi
    color = $accent
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -205
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$($battery --percent)%</b>"
    color = $on_accent
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] $battery --status
    color = $on_accent
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}
