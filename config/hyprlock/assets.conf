# Images the lock screen uses. Yours to edit — nothing generates this file.
#
# $wall lives in wallpaper.conf (written by hyprlock-wallpaper.sh from your
# current wallpaper) and the palette lives in colors.conf (written by matugen).

# Profile photo, shown by layouts 12, 15, 18 and 20.
$avatar = $HOME/Pictures/gifs/FrierenxGengar.png

# Album art placeholder. hyprlock loads this first, then replaces it with
# whatever hlock_mpris.sh prints via reload_cmd. It has to be a file that
# always exists: a missing path makes hyprlock log "cannot get file time" and
# render a broken widget. A 1x1 transparent PNG shows as nothing.
$cover = $HOME/.config/hyprlock/assets/no-art.png
