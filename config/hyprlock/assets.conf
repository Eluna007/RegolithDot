# Images the lock screen uses. Yours to edit — nothing generates this file.
#
# $wall lives in wallpaper.conf (written by hyprlock-wallpaper.sh from your
# current wallpaper) and the palette lives in colors.conf (written by matugen).

# Profile photo, shown by layouts 12, 15, 18 and 20.
$avatar = ~/Pictures/gifs/FrierenxGengar.png

# Album art. hlock_mpris.sh extracts the current track's cover here; the path
# is upstream's and the script writes to it, so both sides have to agree.
$cover = /tmp/hyde-mpris.png
