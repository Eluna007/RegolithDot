name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than relying on whatever the runner image ships, so a
      # runner update cannot silently change what the Apolloku tests run on.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 jq

      - name: Check shell syntax
        run: |
          bash -n config/rofi/scripts/emoji.sh
          bash -n config/ranger/scope.sh
          bash -n scripts/apollo-doctor
          bash -n local/bin/apollo-lock-layout
          bash -n local/bin/apollo-sddm-sync
          bash -n scripts/test-sddm-sync.sh
          bash -n scripts/test-battery.sh
          bash -n scripts/test-network.sh
          bash -n scripts/test-shell-battery.sh
          bash -n scripts/test-playerctlock.sh
          bash -n scripts/test-clipboard.sh
          bash -n config/quickshell/apollo/scripts/clipboard.sh
          bash -n config/quickshell/apollo/scripts/apps.sh
          bash -n config/quickshell/apollo/scripts/wallpaper-thumbs.sh
          bash -n scripts/test-wallpaper-thumbs.sh
          bash -n scripts/test-apps.sh
          bash -n config/quickshell/apollo/scripts/battery.sh
          for f in local/bin/*.sh; do bash -n "$f"; done
          for f in config/hyprlock/scripts/*.sh; do bash -n "$f"; done

      - name: Run shellcheck
        run: |
          shellcheck config/rofi/scripts/emoji.sh
          shellcheck -e SC2034,SC2317 config/ranger/scope.sh
          shellcheck scripts/apollo-doctor
          shellcheck local/bin/apollo-lock-layout
          shellcheck local/bin/apollo-sddm-sync
          shellcheck scripts/test-sddm-sync.sh
          shellcheck scripts/test-battery.sh
          shellcheck scripts/test-network.sh
          shellcheck scripts/test-shell-battery.sh
          shellcheck scripts/test-playerctlock.sh
          shellcheck scripts/test-clipboard.sh
          shellcheck config/quickshell/apollo/scripts/clipboard.sh
          shellcheck config/quickshell/apollo/scripts/apps.sh
          shellcheck config/quickshell/apollo/scripts/wallpaper-thumbs.sh
          shellcheck scripts/test-wallpaper-thumbs.sh
          shellcheck scripts/test-apps.sh
          shellcheck config/quickshell/apollo/scripts/battery.sh
          shellcheck config/hyprlock/scripts/battery.sh
          shellcheck config/hyprlock/scripts/network.sh
          shellcheck local/bin/*.sh

      # A Lua syntax error takes the whole Hyprland config down and leaves you
      # with a handful of emergency keybinds, so this is the check that matters.
      - name: Check Hyprland Lua syntax
        run: luac5.4 -p config/hypr/hyprland.lua config/hypr/lua/*.lua

      # luac -p cannot see a nil index: it is valid syntax. So the modules are
      # actually executed, with every plugin present and on a machine with none
      # loaded — which is what a cold boot is, before autostart's `hyprpm
      # reload` has run. gestures.lua indexing a missing hyprgrass took the
      # whole config down, and with it the touchpad and every keybind.
      - name: Check the Hyprland config loads without its optional plugins
        run: lua5.4 scripts/test-hypr-lua.lua

      # apollo-settings unbinds a keybind's `Default` before applying a new
      # combo. If Default is not the key currently bound to that same action,
      # it unbinds a key someone is actually using — which is how editing the
      # terminal bind once deleted the SUPER+W wallpaper picker.
      #
      # Cross-referenced by label: config.go's Label must equal the bind's
      # `description` in keybinds.lua, and their keys must agree. Checking only
      # that the key exists somewhere is not enough: SUPER+W did exist, as a
      # different bind entirely.
      - name: Check apollo-settings keybind defaults match keybinds.lua
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          go  = pathlib.Path("apollo-settings/config.go").read_text()
          lua = pathlib.Path("config/hypr/lua/keybinds.lua").read_text()

          block = re.search(r"func curatedKeybinds\(\).*?\n}", go, re.S).group(0)
          curated = re.findall(
              r'"(\w+)":\s*\{Label:\s*"([^"]+)",\s*Default:\s*"([^"]+)"', block)
          assert curated, "no curated keybinds parsed from config.go"

          # label -> key, from the live keybinds
          bound = dict(
              (m[1], m[0]) for m in
              re.findall(r'mainMod \.\. " \+ (\S+?)".*?description = "([^"]+)"', lua))
          assert bound, "no described binds parsed from keybinds.lua"

          # The COMBO is only half of it. A curated bind also carries the
          # dispatcher apollo-settings emits when you rebind it, and that is
          # what broke once already: the launcher moved into the shell, and
          # config.go still said `wofi --show drun` — so rebinding SUPER+Space
          # in the settings app would have resurrected wofi. Where keybinds.lua
          # spends an `env.NAME`, resolve M.NAME from config.lua and require
          # config.go to name the same command.
          dispatchers = dict(re.findall(
              r'"(\w+)":\s*\{Label:[^}]*?Dispatcher:\s*`([^`]+)`', block))
          cfg = pathlib.Path("config/hypr/lua/config.lua").read_text()
          env_of = dict(
              (m[1], m[0]) for m in
              re.findall(r'hl\.dsp\.exec_cmd\(env\.(\w+)\).*?description = "([^"]+)"', lua))
          label_of = dict((label, name) for name, label, _ in curated)

          bad = []
          for name, label, combo in curated:
              mods, _, key = combo.partition(",")
              key = key.strip()
              if label not in bound:
                  bad.append(f"{name}: config.go Label {label!r} matches no bind description in keybinds.lua")
              elif bound[label] != key:
                  bad.append(
                      f"{name}: config.go Default is SUPER+{key}, but {label!r} "
                      f"is bound to SUPER+{bound[label]} in keybinds.lua")

          checked = 0
          for label, var in env_of.items():
              name = label_of.get(label)
              if name is None:
                  continue
              m = re.search(r'^M\.%s\s*=\s*"([^"]*)"' % var, cfg, re.M)
              if not m:
                  bad.append(f"{name}: keybinds.lua uses env.{var}, which config.lua does not define")
                  continue
              want = 'hl.dsp.exec_cmd("%s")' % m.group(1)
              got = dispatchers.get(name, "")
              if got != want:
                  bad.append(
                      f"{name}: config.go Dispatcher is {got!r}, but keybinds.lua runs "
                      f"env.{var}, which config.lua defines as {m.group(1)!r}")
              checked += 1

          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"ok - {len(curated)} curated keybind defaults match keybinds.lua "
                f"({checked} dispatchers cross-checked against config.lua)")
          PY

      # The README's detail lives in docs/ now, and a split like that is
      # exactly where relative links rot - a path that was right at the top
      # level is wrong one directory down, and nothing complains until someone
      # clicks it.
      - name: Check doc links resolve
        run: python3 scripts/check-docs.py

      # config.json has two ends, and saveConfig marshals a struct: a key the
      # shell reads but config.go has no field for is dropped on the next save,
      # silently and not by the control that was touched. chessUsername, which
      # the README tells you to add by hand, was exactly that.
      - name: Check config.json keys round-trip
        run: python3 scripts/check-config-keys.py

      # The palette is declared in Config.qml, palette.go and apps.go. Drift is
      # silent: the bar renders one Mocha and the terminal another, or a flavor
      # the shell knows about produces empty colours in kitty's generated file.
      - name: Check palette tables agree
        run: python3 scripts/check-palettes.py

      # config/matugen is symlinked whole into ~/.config, so a template
      # input_path resolves back into this tree. A block naming a file that was
      # never committed makes matugen fail on every wallpaper change - which is
      # what [templates.quickshell] did, silently, for as long as it existed.
      - name: Check matugen templates resolve
        run: python3 scripts/check-matugen-templates.py

      # The greeter reads theme.conf; login.go writes it; Main.qml names the
      # keys. A key read but never written comes back as an empty string, and
      # an empty string is not a colour - QML paints black. On a login screen
      # that is a machine that appears not to boot, with the diagnostic in a
      # log only a working session could show you.
      - name: Check the login screen's colour keys agree
        run: python3 scripts/check-sddm-theme.py

      # apollo-sddm-sync is the one part of the wallpaper pipeline that runs as
      # root, because the greeter is a different user and cannot read $HOME.
      # The test drives it against temporary directories; it skips itself when
      # the runner is not root rather than pretending to have passed.
      - name: Test apollo-sddm-sync
        run: sudo ./scripts/test-sddm-sync.sh

      # An undefined $variable is not an error to hyprlock - it renders as
      # nothing, i.e. black text on a black card, with no diagnostic. Since the
      # colours now come from a generated file, a typo in either half would
      # only show up on a locked screen.
      - name: Check hyprlock layout variables
        run: python3 scripts/check-hyprlock-vars.py

      # Which layout is active is machine state (config/hyprlock/layout.conf,
      # gitignored), and three things have to agree on which layouts exist:
      # the files, apollo-settings' Lock tab, and the apollo-lock-layout CLI.
      # Drift is silent - you find out at the lock screen.
      - name: Check lock screen layout wiring
        run: python3 scripts/check-lock-layouts.py

      # battery.sh is read by layout15 and layout20, and none of its failure
      # modes are visible until the screen is locked. All of these were live:
      # BAT0 assumed to exist, the icon vanishing at exactly 100%, errors
      # printed on a machine with no battery.
      - name: Test battery.sh
        run: ./scripts/test-battery.sh

      # The layouts are vendored from someone else's machine and shell out
      # constantly. `hostname` is not on a base Arch install; the only symptom
      # was an error in hyprlock's log, on a locked screen.
      - name: Check lock screen layout commands are declared
        run: python3 scripts/check-layout-commands.py

      # layout20's wifi and bluetooth widgets. Both used to redirect stderr and
      # fall back to "Disconnected", so a missing tool was indistinguishable
      # from being offline - and both were in fact broken on a stock Arch box.
      - name: Test network.sh
        run: ./scripts/test-network.sh

      # The bar and the system-monitor panel both parse this one line.
      - name: Test the shell's battery script
        run: ./scripts/test-shell-battery.sh

      # Upstream gated every music widget behind an is_spotify() check, so on
      # a machine without Spotify they all printed "Not playing on Spotify"
      # instead of the track. The widget looks populated either way.
      - name: Test playerctlock.sh
        run: ./scripts/test-playerctlock.sh

      # The panel queried cliphist while autostart ran copyq, so it showed an
      # empty history beside a working clipboard manager - and an empty list
      # looks exactly like "you have not copied anything yet".
      - name: Test clipboard.sh
        run: ./scripts/test-clipboard.sh

      # Desktop-entry parsing. Every case in the fixture is something that
      # really sits in /usr/share/applications and would otherwise show up as
      # a broken launcher row.
      - name: Test apps.sh
        run: ./scripts/test-apps.sh

      # A wallpaper's format decides which of two pipelines it takes, and the
      # answer is spelled out separately in five files that cannot see each
      # other. Videos were missing from the picker's filter for as long as the
      # picker existed, so wallpaper-switch.sh's entire mpvpaper branch - gifs
      # and video, the thing hyprpaper cannot do - was unreachable from the UI
      # it was written for.
      - name: Check the wallpaper formats agree
        run: python3 scripts/check-wallpaper-formats.py

      - name: Test wallpaper-thumbs.sh
        run: ./scripts/test-wallpaper-thumbs.sh

      # Ranking is the whole product of a launcher: the orderings that matter
      # are asserted rather than eyeballed.
      - name: Test launcher matching
        run: node scripts/test-launcher.js

      # A cheatsheet that is wrong is worse than none: you look a shortcut up
      # precisely when you do not know it, so you cannot tell. The modmask is a
      # bitfield, hyprctl repeats a bind per submap, and a sheet listing
      # workspaces 1, 10, 2, 3 looks broken.
      - name: Test keybind cheatsheet
        run: node scripts/test-keys.js

      # A QML error is not contained: an unresolved import or a stray brace
      # stops the whole shell loading, so the bar, every panel and the
      # notification daemon vanish together.
      - name: Check QML structure
        run: python3 scripts/check-qml.py

      # Apolloku's puzzle logic is plain ECMAScript, so node can exercise it
      # for real: a generator that sometimes emits a puzzle with two solutions
      # would look completely fine in the UI.
      - name: Test Apolloku logic
        run: node scripts/test-apolloku.js

      # perft against the published node counts for the standard positions.
      # A generator that mishandles en passant, castling through check or a
      # pinned piece cannot match ~11.7M nodes by accident.
      - name: Test chess logic
        run: node scripts/test-chess.js

      # `tailscale status --json` comes from a binary that updates on its own
      # schedule. A field that changes type across a release should blank a
      # widget, not take the bar down with a TypeError.
      - name: Test Tailscale parsing
        run: node scripts/test-tailscale.js

      # /sys/class/power_supply/BAT0 is not a universal path - plenty of
      # laptops expose BAT1. Worse, the callers used to paper over a wrong
      # guess (`|| echo 100`, `2>/dev/null`), so the bar reported a confident,
      # permanent 100% instead of failing. Find the battery, never name it.
      # sudo replaces PATH with its own secure_path, which does not include
      # ~/.local/bin. A `sudo <bare-name>` for anything this repo installs
      # there is "command not found" however correctly it is installed - and
      # the call that prompted this check was `|| true`-guarded, so it would
      # have failed in silence on every wallpaper change forever.
      #
      # The names are read from local/bin rather than listed, so a script added
      # there is covered without anyone remembering to add it here.
      - name: Check for sudo calls secure_path cannot resolve
        run: |
          python3 - <<'PY'
          import re, sys, subprocess
          from pathlib import Path

          names = sorted(p.name for p in Path("local/bin").iterdir() if p.is_file())
          tracked = subprocess.run(
              ["git", "grep", "-nI", "-E", r"sudo\b.*\b(%s)\b" % "|".join(map(re.escape, names)),
               # Markdown and comments are allowed to spell the broken form:
               # explaining why `sudo <bare-name>` cannot work means writing it
               # down. Executable lines are what this is watching.
               "--", ":!old-apollo-shell/**", ":!*.md"],
              capture_output=True, text=True).stdout.splitlines()

          bad = []
          for line in tracked:
              path, _, rest = line.partition(":")
              _, _, body = rest.partition(":")
              if re.match(r"\s*(#|//|--)", body):
                  continue
              for name in names:
                  # A call, a suggestion in an error string, a line of docs -
                  # all three tell someone to run something that cannot work.
                  for m in re.finditer(r"sudo\b[^|;&\n]*?(\S*)" + re.escape(name) + r"\b", body):
                      if "/" not in m.group(1):
                          bad.append(f"{path}: {body.strip()}")
                      break

          if bad:
              print("\n".join(sorted(set(bad))))
              print("\nsudo cannot find these in ~/.local/bin - name them by path "
                    "(sudo ~/.local/bin/<name>).")
              sys.exit(1)
          print(f"ok - no sudo call or instruction relies on a PATH sudo does not have "
                f"({len(names)} commands in local/bin)")
          PY

      - name: Check for hardcoded battery paths
        run: |
          # Comments and prose are allowed to name the path - explaining why it
          # is wrong is the point, which is why README.md and docs/ are exempt. git grep prints path:line:content, so drop the hits
          # whose content starts a comment rather than exempting whole files,
          # which would blind the check to a real regression in them.
          hits=$(git grep -nE 'power_supply/BAT[0-9]' \
                   -- ':!old-apollo-shell/**' ':!.github/**' ':!scripts/test-battery.sh' \
                      ':!README.md' ':!MANUAL-INSTALL.md' ':!docs/**' \
                 | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "Hardcoded battery path. Discover it instead - see config/hyprlock/scripts/battery.sh."
            exit 1
          fi

      - name: Validate XML
        run: python3 -m xml.etree.ElementTree config/Thunar/uca.xml

      - name: Validate JSON
        run: |
          for f in config/dgop/colors.json config/nvim/lazy-lock.json \
                   local/share/PrismLauncher/themes/fiw-arch/theme.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Verify required files
        run: |
          test -f config/quickshell/apollo/shell.qml
          test -f config/quickshell/apollo/bar/Bar.qml
          test -f config/quickshell/apollo/services/Hypr.qml
          test -f config/hypr/hyprland.lua
          test -f config/rofi/config.rasi
          test -f config/rofi/themes/apollo-colors.default.rasi
          test -f config/kitty/apollo-colors.default.conf
          test -f config/gtk-3.0/apollo-colors.default.css
          test -f config/gtk-4.0/apollo-colors.default.css
          test -f config/hypr/hyprlock.conf
          test -f config/hyprlock/assets.conf
          test -f config/hyprlock/assets/no-art.png
          for s in playerctlock hlock_mpris battery network; do test -x "config/hyprlock/scripts/$s.sh"; done
          test -f config/matugen/templates/hyprlock-colors.conf.template
          test -f config/matugen/templates/hyprlock-colors.sh.template
          for n in 12 15 18 20; do test -f "config/hyprlock/layouts/layout$n.conf"; done
          test -x local/bin/apollo-lock-layout
          test -x config/quickshell/apollo/scripts/battery.sh
          test -x config/quickshell/apollo/scripts/clipboard.sh
          test -x config/quickshell/apollo/scripts/apps.sh
          test -f config/quickshell/apollo/panels/LauncherPanel.qml
          test -f config/quickshell/apollo/panels/launcher/Match.js
          test -f config/quickshell/apollo/panels/launcher/Commands.js
          test -f config/quickshell/apollo/panels/KeysPanel.qml
          test -f config/quickshell/apollo/panels/keys/Keys.js
          test -f config/quickshell/apollo/panels/Desktop.qml
          test -f config/quickshell/apollo/services/Motion.qml
          test -f config/quickshell/apollo/panels/ApollokuPanel.qml
          for j in Sudoku Model; do test -f "config/quickshell/apollo/panels/apolloku/$j.js"; done
          test -f config/quickshell/apollo/panels/ChessPanel.qml
          for j in Chess Engine Model; do test -f "config/quickshell/apollo/panels/chess/$j.js"; done
          test -f config/quickshell/apollo/panels/TailscalePanel.qml
          test -f config/quickshell/apollo/panels/tailscale/Tailscale.js
          test -x local/bin/hyprlock-wallpaper.sh
          for s in osd-report restore-wallpaper wallpaper-switch hyprlock-wallpaper; do
            test -x "local/bin/$s.sh"
          done
          test -f local/share/icons/Apollo-Terminal/index.theme
          test -d local/share/icons/Apollo-Terminal/scalable
          for m in config env monitors appearance animations input gestures rules keybinds autostart; do
            test -f "config/hypr/lua/$m.lua"
          done

      # Leftover Moonlit *identifiers* — paths, filenames, binaries — are bugs:
      # they point at things Apollo does not install. Prose mentions of Moonlit
      # are fine and deliberate; this repo is a remake and says so.
      - name: Check for untranslated leftovers
        run: |
          if git grep -nEi 'moonlit-(settings|doctor|colors|copy-path|config|power|temp|shell/)|moonlit\.(conf|lua|png)|config/moonlit|Moonlit-Terminal|moonlitTheme' \
               -- ':!.github/**' ':!README.md' ':!MANUAL-INSTALL.md' ':!docs/**'; then
            echo "Found a Moonlit identifier the rebrand missed."
            exit 1
          fi
          if git grep -nE 'Hyprland\.dispatch\("(workspace|focuswindow|exec|killactive|togglefloating|fullscreen) ' \
               -- 'config/quickshell/**'; then
            echo "Found a hyprlang-era dispatch call; use services/Hypr.qml instead."
            exit 1
          fi

      - name: Check for personal absolute paths
        run: |
          if git grep -nE '/home/[a-z_][a-z0-9_-]*/' \
               -- ':!README.md' ':!MANUAL-INSTALL.md' ':!.github/**' \
                  ':!scripts/apollo-doctor' ':!**/ranger_devicons/**' \
                  ':!old-apollo-shell/**'; then
            echo "Found a hardcoded /home/<user> path in tracked config files."
            exit 1
          fi

  settings-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go and Fyne build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxxf86vm-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version-file: apollo-settings/go.mod

      - name: Build and vet
        working-directory: apollo-settings
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test ./...
